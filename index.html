
<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpinRoll UF</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Menyknapp -->
    <button
        class="menyknapp"
        id="menyknapp"
        aria-label="Öppna meny"
        aria-expanded="false"
        aria-controls="sidomeny">
        ☰
    </button>

    <!-- Sidomeny -->
    <nav class="sidomeny" id="sidomeny" aria-label="Huvudmeny">
        <a href="index.html">Hem</a>
        <a href="exile.html">Exile</a>
        <a href="om-oss.html">Om oss</a>
        <a href="kontakt.html">Kontakt</a>
    </nav>

	<!-- Banner -->
	<img src="pictures/banner.png" alt="SpinRoll banner">

	<!-- SpinRoll-logga -->
	<div class="logga-container">
   	 <img
        src="pictures/logo.png"
        alt="SpinRoll UF"
        class="start-logga">
</div>

<!-- Vinröd övergång -->
<div class="draperi"></div>

    <!-- Vinröd fortsättning med 3D-modell -->
    <div class="rod-fortsattning">

        <model-viewer
            id="spinroll-modell"
            src="https://spinroll.se/box.glb"
            camera-orbit="0deg 75deg 120%"
            camera-target="auto auto auto"
            orientation="160deg 90deg 0deg"
            shadow-intensity="0">
        </model-viewer>

    </div>

    <!-- Bibliotek för 3D-modellen -->
    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
    </script>

    <!-- Scrollstyrd rotation -->
    <script>

const modell = document.querySelector("#spinroll-modell");

function roteraModell() {
    const ruta = modell.getBoundingClientRect();

    const modellMitt = ruta.top + ruta.height / 2;
    const skarmMitt = window.innerHeight / 2;

    const scrollPosition =
        (skarmMitt - modellMitt) / window.innerHeight;

    const rotation = scrollPosition * 60;

    // Rotera kameran i stället för själva modellen
    modell.cameraOrbit = `${rotation}deg 75deg 120%`;
}

window.addEventListener("scroll", roteraModell);
window.addEventListener("resize", roteraModell);
window.addEventListener("load", roteraModell);
modell.addEventListener("load", roteraModell);


        // Uppdatera rotationen när användaren scrollar
        window.addEventListener("scroll", roteraModell);

        // Uppdatera vid ändrad fönsterstorlek
        window.addEventListener("resize", roteraModell);

        // Uppdatera när sidan har laddats
        window.addEventListener("load", roteraModell);

        // Uppdatera när 3D-modellen har laddats
        modell.addEventListener("load", roteraModell);
    </script>

    <!-- Öppna och stäng sidomenyn -->
    <script>
        const menyknapp = document.querySelector("#menyknapp");
        const sidomeny = document.querySelector("#sidomeny");

        menyknapp.addEventListener("click", () => {
            const oppen = sidomeny.classList.toggle("oppen");

            menyknapp.textContent = oppen ? "×" : "☰";
            menyknapp.setAttribute("aria-expanded", String(oppen));
            menyknapp.setAttribute(
                "aria-label",
                oppen ? "Stäng meny" : "Öppna meny"
            );
        });
    </script>

</body>
</html>
